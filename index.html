<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Portfolio</title>
  <meta name="description" content="Manitha Devin Hansaja — video editor, photographer and social media manager from Sri Lanka. Reels, ads, photography, social media pages and websites." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23111217'/%3E%3Ctext x='14' y='47' font-family='Impact,sans-serif' font-size='40' fill='%23fff'%3ED%3C/text%3E%3Crect x='42' y='38' width='9' height='9' fill='%23EF233C'/%3E%3C/svg%3E" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+Sinhala:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Loading screen (text comes from data.js → loader) -->
  <div id="loader" aria-hidden="true">
    <div class="ld-glow"></div>
    <div class="ld-handle">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>
      <span class="mono"></span>
    </div>
    <div class="ld-stage"><p class="ld-line"></p></div>
    <div class="ld-hand">
      <svg viewBox="0 0 24 24" width="34" height="34"><path d="M9 11V4.5a1.5 1.5 0 0 1 3 0V10h.5V8.5a1.5 1.5 0 0 1 3 0V10h.5V9.5a1.5 1.5 0 0 1 3 0V15c0 3.3-2.2 6-5.5 6H12c-2 0-3.3-.9-4.3-2.3L4.6 14.4a1.5 1.5 0 0 1 2.3-1.9L9 14z" fill="#fff" stroke="#000" stroke-width="1.2" stroke-linejoin="round"/></svg>
    </div>
    <button class="ld-skip mono" type="button">skip ↵</button>
  </div>

  <!-- Design-tool chrome shown while the site is being "drawn" -->
  <div class="ruler ruler-top" aria-hidden="true"></div>
  <div class="ruler ruler-left" aria-hidden="true"></div>
  <div id="guides" aria-hidden="true"></div>
  <button class="intro-skip mono" type="button">skip intro ↵</button>

  <!-- Cursor layers: fixed (screen) and absolute (page) -->
  <div id="cursor-layer" aria-hidden="true"></div>
  <div id="draw-layer" aria-hidden="true"></div>

  <header class="nav">
    <a href="#top" class="logo b" id="logo"></a>
    <nav class="nav-links b">
      <a href="#reels">Videos</a>
      <a href="#photos">Photos</a>
      <a href="#pages">Social</a>
      <a href="#work">Web</a>
      <a href="#about">About</a>
      <a href="#journey">Journey</a>
      <a href="#contact">Contact</a>
    </nav>
    <a href="#contact" class="nav-cta mono b"><i class="dot"></i><span id="nav-status">Available</span></a>
  </header>

  <main id="app"></main>

  <!-- Full-size live website viewer -->
  <dialog id="viewer" aria-label="Live website preview">
    <div class="v-bar">
      <span class="v-dots"><i></i><i></i><i></i></span>
      <span class="v-url mono"></span>
      <a class="v-open" target="_blank" rel="noopener">Open site ↗</a>
      <button class="v-close" type="button" aria-label="Close preview">✕</button>
    </div>
    <iframe title="Live website preview"></iframe>
  </dialog>

  <!-- Photo lightbox -->
  <dialog id="photo-viewer" aria-label="Photo">
    <button class="pv-close" type="button" aria-label="Close photo">✕</button>
    <img alt="" />
    <div class="pv-bar">
      <button class="pv-prev" type="button">← Prev</button>
      <span class="pv-cap"></span>
      <span class="pv-count mono"></span>
      <button class="pv-next" type="button">Next →</button>
    </div>
  </dialog>

  <!-- Reel video player -->
  <dialog id="reel-viewer" aria-label="Video player">
    <div class="rv-bar">
      <span class="rv-title"></span>
      <button class="rv-close" type="button" aria-label="Close video">✕</button>
    </div>
    <video controls playsinline></video>
    <div class="rv-nav">
      <button class="rv-prev" type="button">← Prev</button>
      <span class="rv-count mono"></span>
      <button class="rv-next" type="button">Next →</button>
    </div>
  </dialog>

  <!-- Smooth scrolling -->
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
  <script src="data.js"></script>
  <script src="main.js"></script>
</body>
</html>
