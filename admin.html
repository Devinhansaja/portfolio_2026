<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Portfolio Admin</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23D4FF24'/%3E%3Ctext x='14' y='47' font-family='Impact,sans-serif' font-size='40' fill='%23030407'%3EA%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body>
  <header class="top">
    <div class="brand">ADMIN<b>.</b> <span class="mono">portfolio editor</span></div>
    <div class="status" id="status" role="status"></div>
    <div class="actions">
      <button type="button" class="ghost" id="btn-preview" title="Show or hide the live preview">Preview</button>
      <button type="button" class="ghost" id="btn-download" title="Download data.js (text only)">Download</button>
      <button type="button" class="primary" id="btn-publish" disabled>Publish</button>
      <button type="button" class="ghost" id="btn-logout" hidden>Log out</button>
    </div>
  </header>

  <!-- Login / first-time setup (shown on the live site before the editor) -->
  <div id="auth" hidden>
    <div class="auth-card">
      <div class="brand">ADMIN<b>.</b> <span class="mono">portfolio editor</span></div>

      <form id="login-form" hidden autocomplete="on">
        <h1 class="auth-title">Sign in</h1>
        <div class="field"><label for="l-email">Email</label><input id="l-email" type="email" autocomplete="username" required /></div>
        <div class="field"><label for="l-pass">Password</label><input id="l-pass" type="password" autocomplete="current-password" required /></div>
        <div class="field">
          <label for="l-code">Authenticator code</label>
          <input id="l-code" inputmode="numeric" pattern="[0-9 ]{6,7}" maxlength="7" autocomplete="one-time-code" placeholder="123 456" required />
          <p class="hint">The 6-digit code from Google / Microsoft Authenticator.</p>
        </div>
        <p class="auth-error" id="l-error" role="alert"></p>
        <button type="submit" class="primary wide" id="l-submit">Sign in</button>
      </form>

      <div id="setup" hidden></div>
    </div>
  </div>

  <div class="layout">
    <nav id="nav" aria-label="Sections"></nav>
    <main id="editor"></main>
    <section class="preview" id="preview" aria-label="Live preview">
      <div class="pv-bar">
        <span class="mono">live preview</span>
        <span class="pv-tools">
          <button type="button" class="ghost sm" id="pv-device">Mobile</button>
          <button type="button" class="ghost sm" id="pv-reload" title="Reload preview">↻</button>
        </span>
      </div>
      <div class="pv-wrap" id="pv-wrap"><iframe id="pv" title="Live preview of the site"></iframe></div>
    </section>
  </div>

  <div id="busy" hidden><div class="spinner"></div><p id="busy-text">Working…</p></div>
  <div id="toasts" aria-live="polite"></div>

  <script src="data.js"></script>
  <script src="admin.js"></script>
</body>
</html>
